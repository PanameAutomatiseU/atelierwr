name: Identifier La Piscine du Vallon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/review-vallon-20261117.yml"

permissions:
  contents: write

jobs:
  sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet Pillow
      - name: Créer la planche de contrôle
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw

          files = sorted([p for p in Path('a-integrer').iterdir() if p.suffix.lower() in {'.jpg','.jpeg','.png'}])
          cols, cw, ch = 4, 260, 300
          rows = (len(files)+cols-1)//cols
          canvas = Image.new('RGB',(cols*cw,rows*ch),'white')
          draw = ImageDraw.Draw(canvas)
          for pos,path in enumerate(files):
              with Image.open(path) as opened:
                  im=ImageOps.exif_transpose(opened).convert('RGB')
                  im.thumbnail((cw-18,ch-42),Image.Resampling.LANCZOS)
              x=(pos%cols)*cw+(cw-im.width)//2
              y=(pos//cols)*ch+6+(ch-42-im.height)//2
              canvas.paste(im,(x,y))
              draw.rectangle(((pos%cols)*cw,(pos//cols)*ch,(pos%cols+1)*cw-1,(pos//cols+1)*ch-1),outline='#888')
              draw.text(((pos%cols)*cw+8,(pos//cols+1)*ch-27),path.name,fill='black')
          out=Path('tmp-review')
          out.mkdir(exist_ok=True)
          canvas.save(out/'vallon-source-sheet.jpg','JPEG',quality=80,optimize=True,progressive=True)
          PY
      - name: Enregistrer la planche
        run: |
          rm .github/workflows/review-vallon-20261117.yml
          git config user.name 'Atelier WR — contrôle visuel'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Préparer la planche de contrôle du Vallon'
          git push origin main
