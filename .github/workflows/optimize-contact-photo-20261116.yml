name: Optimiser le portrait Contact

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-contact-photo-20261116.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Convertir le portrait pour le web
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          source = "assets/contact-william-rigoulet.png"
          target = "assets/contact-william-rigoulet.jpg"
          with Image.open(source) as original:
              image = ImageOps.exif_transpose(original).convert("RGB")
              image.thumbnail((1200, 1500), Image.Resampling.LANCZOS)
              image.save(target, "JPEG", quality=82, optimize=True, progressive=True)
          PY
      - name: Enregistrer la version optimisée
        run: |
          git config user.name "atelierwr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/contact-william-rigoulet.jpg
          git commit -m "Optimiser le portrait de la page Contact"
          git push
