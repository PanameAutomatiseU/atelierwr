name: Préparer le classement Nus et modèles vivants

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/review-nus-20261117.yml"

permissions:
  contents: write

jobs:
  sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet Pillow
      - name: Créer les planches de contrôle
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from PIL import Image, ImageOps, ImageDraw

          files = sorted(Path('assets/work').glob('nus-*.jpg'), key=lambda p: int(re.search(r'(\d+)', p.stem).group(1)))
          out = Path('tmp-review')
          out.mkdir(exist_ok=True)
          cols, rows, cw, ch = 7, 4, 180, 220
          for page, start in enumerate(range(0, len(files), cols * rows), 1):
              canvas = Image.new('RGB', (cols*cw, rows*ch), 'white')
              draw = ImageDraw.Draw(canvas)
              for pos, path in enumerate(files[start:start+cols*rows]):
                  with Image.open(path) as opened:
                      im = ImageOps.exif_transpose(opened).convert('RGB')
                      im.thumbnail((cw-16, ch-38), Image.Resampling.LANCZOS)
                  x = (pos % cols)*cw + (cw-im.width)//2
                  y = (pos // cols)*ch + 6 + (ch-38-im.height)//2
                  canvas.paste(im, (x,y))
                  draw.rectangle(((pos%cols)*cw, (pos//cols)*ch, (pos%cols+1)*cw-1, (pos//cols+1)*ch-1), outline='#888')
                  draw.text(((pos%cols)*cw+8, (pos//cols+1)*ch-25), path.stem, fill='black')
              canvas.save(out/f'nus-sheet-{page}.jpg', 'JPEG', quality=80, optimize=True, progressive=True)
          PY
      - name: Enregistrer les planches
        run: |
          rm .github/workflows/review-nus-20261117.yml
          git config user.name 'Atelier WR — contrôle visuel'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Préparer les planches de classement des nus'
          git push origin main
