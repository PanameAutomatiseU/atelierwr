name: Importer les nouveaux nus

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-nus-20261115.yml"

permissions:
  contents: write

jobs:
  optimize-and-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Optimiser les onze visuels
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          mapping = [
              ("IMG_1599.JPG", "nus-42.jpg"),
              ("IMG_1913.JPG", "nus-43.jpg"),
              ("IMG_1949.JPG", "nus-44.jpg"),
              ("IMG_2264.JPG", "nus-45.jpg"),
              ("IMG_2265.JPG", "nus-46.jpg"),
              ("IMG_2266.JPG", "nus-47.jpg"),
              ("IMG_2267.JPG", "nus-48.jpg"),
              ("IMG_2270.JPG", "nus-49.jpg"),
              ("IMG_2271.JPG", "nus-50.jpg"),
              ("IMG_3382.JPG", "nus-51.jpg"),
              ("IMG_3401.JPG", "nus-52.jpg"),
          ]
          out = Path("assets/work")
          out.mkdir(parents=True, exist_ok=True)
          for source_name, target_name in mapping:
              source = Path("a-integrer") / source_name
              target = out / target_name
              with Image.open(source) as original:
                  image = ImageOps.exif_transpose(original).convert("RGB")
                  image.thumbnail((1400, 1400), Image.Resampling.LANCZOS)
                  image.save(target, "JPEG", quality=82, optimize=True, progressive=True)
                  print(f"{source_name} -> {target_name}: {image.width}x{image.height}, {target.stat().st_size} octets")
          PY
      - name: Enregistrer les images optimisées
        run: |
          git config user.name "atelierwr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/work/nus-42.jpg assets/work/nus-43.jpg assets/work/nus-44.jpg assets/work/nus-45.jpg assets/work/nus-46.jpg assets/work/nus-47.jpg assets/work/nus-48.jpg assets/work/nus-49.jpg assets/work/nus-50.jpg assets/work/nus-51.jpg assets/work/nus-52.jpg
          git commit -m "Optimiser et importer onze nouveaux visuels de nus"
          git push
