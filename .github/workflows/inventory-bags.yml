name: Inventorier la galerie Maroquinerie

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "work/scrape_bags_gallery.py"
      - ".github/workflows/inventory-bags.yml"

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer le navigateur
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow playwright
          python -m playwright install --with-deps chromium

      - name: Inventorier les 46 planches
        run: python work/scrape_bags_gallery.py

      - name: Enregistrer l’inventaire
        run: |
          git config user.name "Atelier WR — inventaire automatique"
          git config user.email "actions@users.noreply.github.com"
          git add work/bags-gallery-inventory.json work/bags-gallery-contact.jpg
          if git diff --cached --quiet; then
            echo "Inventaire inchangé."
            exit 0
          fi
          git commit -m "Inventorier les planches Maroquinerie et accessoires"
          git push origin main
