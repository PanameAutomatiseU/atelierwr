<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Atelier WR</title>
  <desc id="desc">Identité graphique moderniste de l’Atelier WR. La signature noire dialogue avec un cercle orange, un carré bleu et une grille architecturale.</desc>
  <rect width="1200" height="900" fill="#fff"/>

  <!-- Cadre et grille architecturale -->
  <path d="M36 36H1164V864H36Z" fill="none" stroke="#111" stroke-width="3"/>
  <path d="M36 174H1164M36 636H1164M825 36V864" fill="none" stroke="#111" stroke-width="2"/>
  <path d="M86 82H506" stroke="#111" stroke-width="3"/>
  <path d="M86 116H310" stroke="#111" stroke-width="3"/>

  <!-- Formes élémentaires de l’identité -->
  <circle cx="844" cy="306" r="214" fill="#ff5a00"/>
  <path d="M825 174A252 252 0 0 1 1077 426" fill="none" stroke="#111" stroke-width="3"/>
  <path d="M825 174A252 252 0 0 0 573 426" fill="none" stroke="#111" stroke-width="3"/>
  <rect x="825" y="636" width="339" height="228" fill="#1235d1"/>
  <circle cx="1099" cy="108" r="17" fill="#111"/>
  <circle cx="1099" cy="108" r="7" fill="#fff"/>

  <!-- Cartouche studio -->
  <text x="86" y="232" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="14" fill="#111">ATELIER</text>
  <text x="1110" y="232" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="4" fill="#111">STUDIO DE CRÉATION</text>

  <!-- Signature WR -->
  <image href="data:image/png;base64," x="72" y="286" width="790" height="265" preserveAspectRatio="xMidYMid meet"/>
  <path d="M86 558H700" stroke="#111" stroke-width="10"/>
  <rect x="705" y="548" width="120" height="20" fill="#1235d1"/>

  <!-- Baseline -->
  <text x="86" y="705" font-family="'Plus Jakarta Sans', Arial, Helvetica, sans-serif" font-size="46" font-weight="600" letter-spacing="-1.5" fill="#111">Chaque création doit trouver</text>
  <text x="86" y="766" font-family="'Plus Jakarta Sans', Arial, Helvetica, sans-serif" font-size="46" font-weight="600" letter-spacing="-1.5" fill="#111">sa signature et son identité propre.</text>
  <text x="86" y="823" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#111">DESIGN  ·  ART DIRECTION  ·  MARSEILLE</text>

  <!-- Index graphique -->
  <text x="1120" y="724" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" fill="#fff">WR</text>
  <text x="1120" y="780" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="5" fill="#fff">01 / 26</text>
  <path d="M882 814H1120" stroke="#fff" stroke-width="3"/>
</svg>
